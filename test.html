<!-- Runnable check: open in Firefox, expect six PASS lines. Fakes the Twitch DOM
     (transformed ancestor included) with canvas streams. -->
<body style="margin:0">
<div id="player" class="video-player__container" style="width:640px;height:360px">
  <video id="ad" autoplay muted style="width:100%;height:100%"></video>
</div>
<div id="col" style="transform:translate(-10px,0);overflow:hidden;width:200px"></div>
<pre id="out">running...</pre>
<script>
const feed = () => {
  const c = Object.assign(document.createElement('canvas'), { width: 64, height: 36 });
  setInterval(() => c.getContext('2d').fillRect(0, 0, 64, 36), 100);
  return c.captureStream(5);
};
// Builds the .picture-by-picture-player host plus a live video inside it.
const spawn = () => {
  col.innerHTML = '<div id="host" class="picture-by-picture-player">' +
    '<div class="pbyp-player-instance"></div></div>';
  const v = document.createElement('video');
  v.autoplay = true; v.muted = true; v.style.cssText = 'width:200px;height:112px';
  v.srcObject = feed(); v.volume = 0;
  col.querySelector('.pbyp-player-instance').append(v);
  return v;
};
ad.srcObject = feed(); ad.volume = 0.4;
ad.addEventListener('playing', () => { ad.muted = false; }, { once: true });
</script>
<script src="content.js"></script>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
const log = m => out.textContent += '\n' + m;
const check = (name, o) =>
  log(Object.values(o).every(Boolean) ? 'PASS ' + name : `FAIL ${name} ${JSON.stringify(o)}`);
const ui = () => document.querySelector('div[data-adswap]');

(async () => {
  const v1 = spawn();
  await wait(2500);
  check('swap', {
    enlarged: v1.getBoundingClientRect().width > 600,
    escapedTransform: v1.parentElement === document.body,
    unmuted: v1.muted === false && v1.volume > 0,
    adMuted: ad.muted === true,
    playing: !v1.paused,
    uiShown: !!ui() && !!ui().querySelector('button'),
  });

  const before = v1.volume;
  v1.dispatchEvent(new WheelEvent('wheel', { deltaY: -100, cancelable: true }));
  const up = v1.volume;
  v1.dispatchEvent(new WheelEvent('wheel', { deltaY: 100, cancelable: true }));
  check('wheel volume', { raised: up > before, lowered: v1.volume < up });

  // Geometry must follow the player, not the size captured at swap time.
  player.style.width = '900px';
  dispatchEvent(new Event('resize'));
  check('follows resize', {
    videoResized: Math.round(v1.getBoundingClientRect().width) === 900,
    uiMoved: Math.round(parseFloat(ui().style.left)) === Math.round(player.getBoundingClientRect().left) + 12,
  });

  // A feed can die while the DOM stays put: tracks end, the element never pauses.
  v1.srcObject.getTracks().forEach(t => t.stop());
  await wait(6000);
  check('revert on stalled feed', {
    overlayGone: !document.body.contains(v1),
    uiGone: !ui(),
    adUnmuted: ad.muted === false,
    hostStillThere: !!document.querySelector('.picture-by-picture-player'),
  });

  const v2 = spawn();
  await wait(2000);
  host.remove();
  await wait(2000);
  check('revert on host removal', { overlayGone: !document.body.contains(v2), uiGone: !ui() });

  const v3 = spawn();
  await wait(2000);
  const swapped = document.body.contains(v3);
  ui().querySelector('button').click();
  await wait(2500);   // long enough for the detector to try swapping again
  check('back to ad button', {
    swappedFirst: swapped,
    overlayGone: !document.body.contains(v3),
    adUnmuted: ad.muted === false,
    staysOff: !ui(),                       // suppressed until this ad ends
  });
})();
</script>
</body>
